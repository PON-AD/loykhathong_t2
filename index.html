<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ลอยกระทงออนไลน์ - โรงเรียนเทศบาล ๒ (แม่ต๋ำดรุณเวทย์)</title>
    <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>
    <div class="fireworks-container" id="fireworksContainer"></div>
    <div class="moon"></div>
    <div class="moon-reflection"></div>

    <header class="header-banner">
        <h1 class="school-title">✨ โรงเรียนเทศบาล ๒ (แม่ต๋ำดรุณเวทย์) ✨</h1>
        <p class="sub-title">สืบสานประเพณีลอยกระทงออนไลน์ ร่วมขอขมาพระแม่คงคา</p>
    </header>

    <div class="control-panel">
        <span class="select-label">เลือกแบบกระทงของคุณ</span>
        <div class="krathong-select">
            <div class="krathong-option active" data-type="icon" data-icon="🪷">
                <span class="icon">🪷</span>
                <span class="label">ดอกบัว</span>
            </div>
            <div class="krathong-option" data-type="draw" data-icon="draw">
                <span class="icon">🎨</span>
                <span class="label">วาดเอง</span>
            </div>
        </div>

        <div class="draw-area" id="drawArea" style="display: none;">
            <canvas id="krathongCanvas" width="260" height="110"></canvas>
            <div class="draw-tools">
                <div class="color-palette">
                    <div class="color-dot active" style="background: #16a34a;" data-color="#16a34a"></div>
                    <div class="color-dot" style="background: #e11d48;" data-color="#e11d48"></div>
                    <div class="color-dot" style="background: #2563eb;" data-color="#2563eb"></div>
                    <div class="color-dot" style="background: #ca8a04;" data-color="#ca8a04"></div>
                    <div class="color-dot" style="background: #9333ea;" data-color="#9333ea"></div>
                </div>
                <div class="brush-actions">
                    <input type="range" id="brushSize" min="2" max="10" value="4">
                    <button class="clear-btn" onclick="clearCanvas()">ล้างกระดาน</button>
                </div>
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="userName" placeholder="ชื่อ-นามสกุล / ชั้นเรียน (เช่น ด.ช.รักเรียน ป.6/1)">
            <input type="text" id="userWish" placeholder="คำอธิษฐานของคุณ...">
        </div>

        <button class="launch-btn" onclick="launchKrathong()">🌕 ปล่อยกระทงลงสู่สายน้ำ 🌕</button>
    </div>

    <div class="river" id="river">
        <div class="phayanak-center-bg">
            <svg class="kwan-phayao-svg" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
                <!-- เจดีย์ตรงกลาง -->
                <g transform="translate(365, 90)">
                    <polygon points="35,-20 45,0 25,0" fill="#ffd700" />
                    <rect x="33" y="0" width="4" height="10" fill="#ffd700" />
                    <path d="M 15 10 L 55 10 L 60 35 L 10 35 Z" fill="#ffd700" />
                    <path d="M 10 35 L 60 35 L 65 60 L 5 60 Z" fill="#e6c229" />
                    <path d="M 5 60 L 65 60 L 72 85 L -2 85 Z" fill="#cca71b" />
                    <rect x="-10" y="85" width="90" height="15" fill="#997a00" rx="2" />
                </g>

                <!-- พญานาคฝั่งซ้าย -->
                <g transform="translate(40, 100)">
                    <rect x="0" y="70" width="240" height="25" fill="#1b2a47" stroke="#ffd700" stroke-width="1.5" rx="3"/>
                    <path d="M 0 78 L 240 78 M 0 88 L 240 88" stroke="#ffd700" stroke-width="0.8" opacity="0.5"/>
                    <path d="M 15 65 Q 60 20 105 65 Q 150 110 195 50 L 210 10 Q 215 -5 200 -15 Q 185 -25 180 -5 L 185 20" fill="none" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round"/>
                    <path d="M 15 65 Q 60 20 105 65 Q 150 110 195 50 L 210 10 Q 215 -5 200 -15 Q 185 -25 180 -5 L 185 20" fill="none" stroke="#ffd700" stroke-width="8" stroke-linecap="round"/>
                    <polygon points="120,42 135,30 125,55" fill="#ffd700" />
                    <polygon points="75,55 90,43 80,68" fill="#ffd700" />
                </g>

                <!-- พญานาคฝั่งขวา -->
                <g transform="translate(520, 100)">
                    <rect x="0" y="70" width="240" height="25" fill="#1b2a47" stroke="#ffd700" stroke-width="1.5" rx="3"/>
                    <path d="M 0 78 L 240 78 M 0 88 L 240 88" stroke="#ffd700" stroke-width="0.8" opacity="0.5"/>
                    <path d="M 225 65 Q 180 20 135 65 Q 90 110 45 50 L 30 10 Q 25 -5 40 -15 Q 55 -25 60 -5 L 55 20" fill="none" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round"/>
                    <path d="M 225 65 Q 180 20 135 65 Q 90 110 45 50 L 30 10 Q 25 -5 40 -15 Q 55 -25 60 -5 L 55 20" fill="none" stroke="#ffd700" stroke-width="8" stroke-linecap="round"/>
                    <polygon points="120,42 105,30 115,55" fill="#ffd700" />
                    <polygon points="165,55 150,43 160,68" fill="#ffd700" />
                </g>
            </svg>
        </div>
    </div>

    <!-- Firebase Real-time Database SDK & Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const krathongsRef = ref(db, 'krathongs');

        window.sendKrathongToFirebase = function(name, wish, visualContent, isCustom) {
            push(krathongsRef, {
                name: name,
                wish: wish,
                visualContent: visualContent,
                isCustom: isCustom,
                timestamp: Date.now()
            });
        };

        onChildAdded(krathongsRef, (snapshot) => {
            const data = snapshot.val();
            if (data && typeof createKrathongElement === 'function') {
                createKrathongElement(data.name, data.wish, data.visualContent, data.isCustom);
            }
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
